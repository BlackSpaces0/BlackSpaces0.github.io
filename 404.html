<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#161112">
  <title>Página no encontrada · FOXSEC</title>
  <link rel="icon" type="image/svg+xml" href="/assets/foxsec-icon.svg">
  <style>
    :root{color-scheme:dark;--bg:#161112;--surface:#1f1819;--text:#efe0e0;--muted:#d7c2c3;--accent:#ffb3b6;--on-accent:#561e24;--line:#a08c8d;--focus:#e9c176}
    @media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#fff8f7;--surface:#fbeeed;--text:#231919;--muted:#534343;--accent:#9a4047;--on-accent:#fff;--line:#857373;--focus:#6f5100}}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:400 1rem/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,680px);padding:clamp(28px,7vw,64px);border:1px solid var(--line);border-radius:28px;background:var(--surface)}
    .brand{margin:0 0 36px;color:var(--accent);font-size:.9rem;font-weight:800;letter-spacing:.18em}
    h1{margin:0;font-size:clamp(3.5rem,15vw,7rem);line-height:1;letter-spacing:-.06em}
    h1 span{color:var(--accent)}
    p{max-width:48ch;color:var(--muted)}
    a{display:inline-flex;align-items:center;min-height:48px;margin-top:12px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none}
    a:hover{filter:brightness(1.08)}
    a:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <p class="brand">FOXSEC</p>
    <h1>4<span>0</span>4</h1>
    <p>No encontramos esa página. Puede que el enlace haya cambiado o que la dirección esté mal escrita.</p>
    <a href="/index.html#inicio">Volver al inicio</a>
  </main>
</body>
</html>
