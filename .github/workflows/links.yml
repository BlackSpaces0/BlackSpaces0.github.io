name: Revisar enlaces

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar enlaces
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --max-retries 2 --timeout 20
            --accept "200..=299,403,429"
            --exclude "instagram.com" --exclude "google.com/search" --exclude "t.me"
            README.md index.html "data/*.json"
          fail: false
          output: lychee-report.md
      - name: Guardar reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-enlaces
          path: lychee-report.md
