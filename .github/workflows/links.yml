name: Revisar enlaces

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Comprobar enlaces externos e internos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar enlaces
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --max-concurrency 8 --max-retries 2 --timeout 20
            --root-dir .
            --accept "200..=299,403,429"
            --exclude "instagram.com" --exclude "google.com/search" --exclude "t.me"
            './**/*.md' './**/*.html' './**/*.json'
          fail: false
          output: lychee-report.md
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-enlaces
          path: lychee-report.md
          if-no-files-found: warn
