name: Revisar enlaces

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Comprobar enlaces externos e internos
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Revisar enlaces en documentación, páginas y catálogos
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-concurrency 8 './**/*.md' './**/*.html' './**/*.json'
