name: Reportar un error
description: Informa de un problema en el sitio, contenido o enlaces.
title: "[Error]: "
labels:
  - bug
body:
  - type: input
    id: location
    attributes:
      label: Página o sección
      description: Indica el enlace o nombre de la sección afectada.
      placeholder: "index.html#glosario"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué ocurre?
      description: Explica el error y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abre ... 2. Selecciona ..."
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Antes de enviar
      options:
        - label: No he incluido contraseñas, tokens, datos personales ni información sensible.
          required: true
